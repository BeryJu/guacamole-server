name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variants:
          - tag: ""
            label: "Default"
          - tag: "-fips"
            patches: fips.patch
            label: "FIPS"
            build_args: |
              BUILD_IMAGE=ghcr.io/goauthentik/fips-debian:trixie-slim-fips
              RUN_IMAGE=ghcr.io/goauthentik/fips-debian:trixie-slim-fips
    name: Build ${{ matrix.variants.label }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: tag
        run: |
          cd guacamole-server
          guac_tag=$(git describe --tags)
          owner="${{ github.repository_owner }}"
          echo "tag=$guac_tag" >> "$GITHUB_OUTPUT"
          echo "org=$(echo $owner | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Apply patches
        run: |
          git apply ${{ matrix.variants.patches }} --allow-empty
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          tags: |
            ghcr.io/${{ steps.tag.outputs.org }}/guacd:${{ steps.tag.outputs.tag }}${{ matrix.variants.tag }}
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          context: .
          build-args: ${{ matrix.variants.build_args }}
